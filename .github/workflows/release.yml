# Publishes the one package named by the pushed release tag.
#
# Tag format: <package-directory>@<version>, for example stats@0.1.3. Only that
# package is published, so a version bump in one package never waits on a
# sibling's version or forces every package to move together. The tag's version
# is checked against packages/<directory>/package.json and against the registry,
# so pushing the same tag twice publishes once and then skips.
#
# Auth is npm Trusted Publishing (OIDC): no long-lived token in this repository.
# Configure each package once on npmjs.com -> package -> Settings -> Trusted
# Publisher -> GitHub Actions, pointing at this repository and this workflow.
#
# The very first release of each package cannot use trusted publishing (the
# package does not exist on npm yet), so publish v0.1.0 locally once after
# `npm login`. Every release after that runs here tokenless.
name: Release

on:
  push:
    tags: ["*@*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Read the release tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          dir="${TAG%@*}"
          version="${TAG##*@}"
          if [[ ! "${dir}" =~ ^[a-z0-9][a-z0-9-]*$ || ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Tag '${TAG}' is not <package-directory>@<version>."
            exit 1
          fi
          if [[ ! -d "packages/${dir}" ]]; then
            echo "::error::Tag '${TAG}' does not name a package under packages/."
            exit 1
          fi
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11

      - name: Install direnv for integration tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes direnv

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify before publish
        run: |
          bun run build:check
          bun test ./packages ./scripts

      - name: Publish ${{ steps.tag.outputs.dir }}
        run: |
          bun scripts/publish.ts "packages/${{ steps.tag.outputs.dir }}" \
            --expected-version "${{ steps.tag.outputs.version }}" \
            --provenance
